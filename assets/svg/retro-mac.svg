<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" width="100%" height="100%">
  <defs>
    <!-- White sticker die-cut outline filter -->
    <filter id="sticker-cut" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#sticker-cut)">
    <!-- Die-cut white border sticker backing -->
    <path d="M 22,12 L 138,12 Q 146,12 146,20 L 146,190 Q 146,198 138,198 L 22,198 Q 14,198 14,190 L 14,20 Q 14,12 22,12 Z" 
          fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1"/>

    <!-- Main Beige Computer Body -->
    <rect x="20" y="18" width="120" height="172" rx="6" fill="#E5DFD1" stroke="#141416" stroke-width="3"/>
    
    <!-- Recessed CRT Monitor Bevel -->
    <rect x="30" y="28" width="100" height="84" rx="8" fill="#6E6B65" stroke="#141416" stroke-width="2.5"/>
    <!-- CRT Curved Screen Glass -->
    <rect x="34" y="32" width="92" height="76" rx="6" fill="#222428" stroke="#141416" stroke-width="1.5"/>
    
    <!-- Screen Glare / Reflection -->
    <path d="M 36,34 L 75,34 L 50,106 L 36,106 Z" fill="#FFFFFF" opacity="0.06"/>
    
    <!-- Cursive "hello." text on screen -->
    <path d="M 48,76 C 48,58 53,52 55,52 C 57,52 57,60 57,74 M 57,64 C 62,56 68,58 68,66 L 68,74 M 73,68 C 73,60 81,60 81,67 C 81,69 73,69 73,71 C 73,75 80,75 82,73 M 87,52 L 87,74 M 93,52 L 93,74 M 99,66 C 99,60 107,60 107,67 C 107,75 99,75 99,66 Z M 111,73 A 1.5,1.5 0 1,1 111,73.1" 
          fill="none" stroke="#F5F3E9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rainbow Apple Logo Badge -->
    <rect x="32" y="128" width="8" height="10" rx="1" fill="#FFD028" stroke="#141416" stroke-width="1"/>
    <line x1="32" y1="130" x2="40" y2="130" stroke="#48BB78" stroke-width="1.5"/>
    <line x1="32" y1="132" x2="40" y2="132" stroke="#ED8936" stroke-width="1.5"/>
    <line x1="32" y1="134" x2="40" y2="134" stroke="#E53E3E" stroke-width="1.5"/>
    <line x1="32" y1="136" x2="40" y2="136" stroke="#9F7AEA" stroke-width="1.5"/>

    <!-- Horizontal 3.5" Floppy Disk Drive Slot -->
    <rect x="82" y="128" width="44" height="5" rx="1.5" fill="#141416"/>
    <rect x="116" y="136" width="10" height="3" rx="0.5" fill="#8E8B83" stroke="#141416" stroke-width="0.8"/>

    <!-- Bottom Recessed Grille Lines -->
    <g stroke="#141416" stroke-width="1.5" stroke-linecap="round">
      <line x1="32" y1="172" x2="128" y2="172"/>
      <line x1="32" y1="177" x2="128" y2="177"/>
    </g>
  </g>
</svg>