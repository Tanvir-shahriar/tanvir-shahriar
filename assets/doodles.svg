  </symbol>
  <symbol id="stamp-border" viewBox="0 0 160 120">
    <defs>
    <pattern id="scallop" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="0" r="3.5" fill="#FBF9F5"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="152" height="112" rx="4" fill="#B9E7CA" stroke="#141416" stroke-width="2"/>
  <!-- Top/Bottom perforation dots -->
  <g fill="#141416">
    <circle cx="16" cy="4" r="3"/>
    <circle cx="32" cy="4" r="3"/>
    <circle cx="48" cy="4" r="3"/>
    <circle cx="64" cy="4" r="3"/>
    <circle cx="80" cy="4" r="3"/>
    <circle cx="96" cy="4" r="3"/>
    <circle cx="112" cy="4" r="3"/>
    <circle cx="128" cy="4" r="3"/>
    <circle cx="144" cy="4" r="3"/>
    
    <circle cx="16" cy="116" r="3"/>
    <circle cx="32" cy="116" r="3"/>
    <circle cx="48" cy="116" r="3"/>
    <circle cx="64" cy="116" r="3"/>
    <circle cx="80" cy="116" r="3"/>
    <circle cx="96" cy="116" r="3"/>
    <circle cx="112" cy="116" r="3"/>
    <circle cx="128" cy="116" r="3"/>
    <circle cx="144" cy="116" r="3"/>
  </g>
  </symbol>
