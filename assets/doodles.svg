  <path d="M 10,8 L 12.5,8 L 12.5,24 L 10,24 Z M 21,8 L 23.5,8 L 23.5,24 L 21,24 Z M 12.5,8 L 23.5,24 L 21,24 L 10,8 Z" fill="#FFFFFF"/>
