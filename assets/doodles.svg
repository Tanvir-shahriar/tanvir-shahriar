  <path d="M 12,7 C 12,5.3 13.3,4 15,4 C 16.7,4 18,5.3 18,7 L 18,17 C 18,18.7 16.7,20 15,20 C 13.3,20 12,18.7 12,17 Z" fill="#36C5F0"/>
  <path d="M 25,20 C 26.7,20 28,18.7 28,17 C 28,15.3 26.7,14 25,14 L 22,14 L 22,17 C 22,18.7 23.3,20 25,20 Z" fill="#2EB67D"/>
  <path d="M 20,25 C 20,26.7 18.7,28 17,28 C 15.3,28 14,26.7 14,25 L 14,15 C 14,13.3 15.3,12 17,12 C 18.7,12 20,13.3 20,15 Z" fill="#ECB22E"/>
  </symbol>
  <symbol id="logo-nike" viewBox="0 0 80 32">
    <path d="M 12,19 C 24,24 45,26 68,9 C 61,16 46,27 28,27 C 18,27 12,23 12,19 Z" fill="#141416"/>
  </symbol>
  <symbol id="logo-honda" viewBox="0 0 40 32">
    <path d="M 6,6 C 6,4 34,4 34,6 L 31,24 C 31,27 28,28 25,28 C 22,28 20,27 20,27 C 20,27 18,28 15,28 C 12,28 9,27 9,24 Z M 13,8 L 14,24 C 16,24.5 18,24.5 19,22 L 19,8 Z M 21,8 L 21,22 C 22,24.5 24,24.5 26,24 L 27,8 Z" fill="#141416"/>
