  <path d="M 32,8 L 38,8 L 32,24 L 26,24 Z" fill="#141416"/>
  <path d="M 40,9 L 38,13 L 42,13 L 40,17 L 36,17 L 34,21 L 44,21 L 43,24 L 30,24 L 38,8 L 46,8 Z" fill="#E10600" opacity="0.9"/>
  </symbol>
  <symbol id="logo-slack" viewBox="0 0 32 32">
