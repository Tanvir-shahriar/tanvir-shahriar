    <path d="M 14,8 L 22,8 C 28,8 30,12 30,16 C 30,20 28,24 22,24 L 14,24 Z M 19,12 L 19,20 L 22,20 C 24,20 25,18 25,16 C 25,14 24,12 22,12 Z M 35,8 L 40,8 L 40,20 C 40,23 38,24 35,24 C 33,24 32,23 32,22 L 35,20 C 35,20.5 35.5,21 36.5,21 C 37.5,21 37.5,20 37.5,19 L 37.5,8 Z M 46,8 L 50,8 L 50,24 L 46,24 Z" fill="#141416"/>
  </symbol>
