  <path d="M 14,10 L 8,10 L 8,8 L 20,8 L 20,10 L 14,10 L 14,24 L 11,24 L 11,10 Z M 22,17 C 22,14 28,13 28,16 C 28,19 22,18 22,22 C 22,25 28,25 29,22 L 27,21 C 26,23 24,23 24,21 C 24,19 30,19 30,16 C 30,12 24,12 22,14 Z" fill="#FFFFFF"/>
  </symbol>
  <symbol id="logo-nextjs" viewBox="0 0 32 32">
